services:
  db:
    image: postgres:16
    container_name: capelania_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - capelania_db_data:/var/lib/postgresql/data

volumes:
  capelania_db_data:
